<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lifeline: build sequence diagrams as YAML, link flows together, and drill down.">
<title>Lifeline Sequence Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style id="monaco-css"></style>
<style>
/* Layout: drafting-table tool — flow tree rail | dot-grid canvas | inspector with notes. YAML tab swaps the canvas for a full editor. */
:root {
  --bg: #e8ecf0;
  --panel: #f5f7f9;
  --surface: #fcfdfe;
  --canvas: #f1f4f7;
  --dot: #d0d7e0;
  --ink: #17202c;
  --muted: #5a6577;
  --faint: #8c96a6;
  --line: #cdd4dd;
  --rule: #dde2e8;
  --accent: #2646cf;
  --accent-ink: #ffffff;
  --accent-soft: #e2e7fb;
  --link: #b2500d;
  --link-soft: #fbede1;
  --note: #e0760b;
  --b-blue: #2453c9; --b-green: #1f7a4d; --b-orange: #b85c00; --b-red: #c0392b; --b-purple: #7a3fc4; --b-teal: #0f7f86; --b-gray: #5a6577;
  --ok: #1f7a4d;
  --warn: #9a6200;
  --danger: #b42323;
  --shadow: 0 10px 30px rgba(23, 32, 44, .14);
  --f-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1116; --panel: #131820; --surface: #19202a; --canvas: #10151b; --dot: #232b36;
    --ink: #e3e8ef; --muted: #98a3b4; --faint: #6c7788; --line: #333c49; --rule: #242c37;
    --accent: #8d9fff; --accent-ink: #0d1116; --accent-soft: #222b4c; --link: #f1a25c; --link-soft: #3a2716; --note: #ff9a3c;
    --b-blue: #8fa8ff; --b-green: #5fcf95; --b-orange: #f2a65a; --b-red: #ff8a80; --b-purple: #c39bff; --b-teal: #5fd0d6; --b-gray: #a3adbb;
    --ok: #5fcf95; --warn: #e9b44c; --danger: #ff7c7c; --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1116; --panel: #131820; --surface: #19202a; --canvas: #10151b; --dot: #232b36;
  --ink: #e3e8ef; --muted: #98a3b4; --faint: #6c7788; --line: #333c49; --rule: #242c37;
  --accent: #8d9fff; --accent-ink: #0d1116; --accent-soft: #222b4c; --link: #f1a25c; --link-soft: #3a2716; --note: #ff9a3c;
  --b-blue: #8fa8ff; --b-green: #5fcf95; --b-orange: #f2a65a; --b-red: #ff8a80; --b-purple: #c39bff; --b-teal: #5fd0d6; --b-gray: #a3adbb;
  --ok: #5fcf95; --warn: #e9b44c; --danger: #ff7c7c; --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-ui); overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* ---------- top bar ---------- */
.top {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 14px;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -.01em; font-size: 15px; }
.brand svg { display: block; }
.title-wrap { display: flex; align-items: center; gap: 6px; min-width: 0; }
.file-chip {
  display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 260px; flex: 0 1 auto; height: 26px;
  padding: 0 9px; border: 1px solid var(--rule); border-radius: 13px; background: var(--surface); color: var(--muted);
  font: 500 11.5px var(--f-mono); cursor: default; white-space: nowrap;
}
.file-chip .fn { overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.file-sync {
  width: 17px; height: 20px; flex: none; display: grid; place-items: center; padding: 0; border: 0;
  background: transparent; color: var(--ok); cursor: pointer;
}
.file-sync svg { width: 15px; height: 15px; }
.file-sync[data-enabled="false"] { color: var(--danger); }
.file-sync:disabled { cursor: default; }
.file-sync:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
.file-chip[data-state="blocked"], .file-chip[data-state="error"] { border-color: var(--danger); }
.file-chip[data-state="blocked"] .file-sync, .file-chip[data-state="error"] .file-sync { color: var(--danger); }
.file-chip[data-state="blocked"] .st, .file-chip[data-state="error"] .st { color: var(--danger); cursor: pointer; }
.doc-title {
  min-width: 0; width: 100%; max-width: 360px; border: 1px solid transparent; background: transparent;
  padding: 5px 8px; border-radius: 6px; font-weight: 500; color: var(--muted);
}
.title-wrap .doc-title { width: auto; flex: 0 1 auto; }
.doc-title:hover { border-color: var(--line); }
.doc-title:focus { border-color: var(--accent); color: var(--ink); background: var(--surface); outline: none; }
.tabs { display: flex; background: var(--bg); border: 1px solid var(--rule); border-radius: 9px; padding: 3px; gap: 2px; }
.tab {
  border: 0; background: transparent; padding: 5px 14px; border-radius: 6px; cursor: pointer;
  font-weight: 600; color: var(--muted); font-size: 13px; display: flex; gap: 7px; align-items: center;
}
.tab kbd { font: 500 10px var(--f-mono); color: var(--faint); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tab[aria-selected="true"] kbd { color: var(--accent); }
.actions { display: flex; gap: 4px; align-items: center; position: relative; }
.ibtn {
  border: 1px solid transparent; background: transparent; border-radius: 7px; height: 32px; min-width: 32px;
  padding: 0 9px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
  color: var(--muted); font-weight: 500; font-size: 13px;
}
.ibtn:hover:not(:disabled) { background: var(--bg); color: var(--ink); border-color: var(--rule); }
.ibtn:disabled { opacity: .38; cursor: default; }
.ibtn svg { width: 16px; height: 16px; flex: none; }
.menu {
  position: absolute; right: 0; top: 38px; z-index: 30; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow); padding: 6px; min-width: 210px; display: grid;
}
.menu button {
  border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer;
  display: flex; justify-content: space-between; gap: 12px;
}
.menu button:hover { background: var(--accent-soft); }
.menu button small { color: var(--faint); font: 11px var(--f-mono); }
.menu hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 2px; }

/* ---------- body grid ---------- */
.body { display: grid; grid-template-columns: 236px minmax(0, 1fr) 344px; min-height: 0; }
.body.no-insp { grid-template-columns: 236px minmax(0, 1fr); }
.body.mode-yaml { grid-template-columns: 236px minmax(0, 1fr); }
.body.mode-yaml .insp { display: none; }
.body.mode-yaml .stage { grid-template-rows: minmax(0, 1fr); }
.body.no-insp .insp { display: none; }

/* rail */
.rail { background: var(--panel); border-right: 1px solid var(--rule); overflow: auto; padding: 14px 10px 20px; min-width: 0; }
.rail-h { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 8px; }
.eyebrow { font: 600 10.5px var(--f-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
.tree { display: grid; gap: 1px; }
.tree-file { display: grid; gap: 1px; margin-bottom: 10px; }
.tree-file:last-child { margin-bottom: 0; }
.tree-file-name {
  padding: 5px 8px 3px 26px; color: var(--faint); font: 600 10.5px var(--f-mono);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tree-item {
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 6px;
  border: 0; background: transparent; text-align: left; padding: 6px 8px; border-radius: 6px; cursor: pointer;
  color: var(--ink);
}
.tree-item:hover { background: var(--bg); }
.tree-item .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-item .ct { font: 11px var(--f-mono); color: var(--faint); font-variant-numeric: tabular-nums; }
.tree-item .gl { color: var(--faint); font: 12px var(--f-mono); width: 12px; text-align: center; }
.tree-item.active { background: var(--accent-soft); font-weight: 600; }
.tree-item.active .gl { color: var(--accent); }
.rail-sec { margin-top: 16px; padding: 0 6px 6px; }


/* File groups: prominent filenames, subtle flow indentation, contextual creation. */
.rail-h { gap: 8px; padding-bottom: 12px; }
.rail-new-file { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:7px; padding:5px 8px; background:var(--surface); color:var(--accent); font-size:11px; font-weight:700; cursor:pointer; }
.rail-new-file:hover { border-color:var(--accent); background:var(--accent-soft); }
.rail-new-file svg, .tree-file-add svg, .tree-file-icon svg { width:15px; height:15px; }
.tree-file { border:1px solid var(--rule); border-radius:9px; background:var(--surface); overflow:hidden; margin:0 0 10px; gap:0; }
.tree-file.current { border-color:color-mix(in srgb, var(--accent) 48%, var(--rule)); }
.tree-file-heading { display:flex; align-items:center; gap:7px; min-width:0; padding:8px 7px 8px 10px; background:var(--panel); border-bottom:1px solid var(--rule); }
.tree-file.current .tree-file-heading { background:var(--accent-soft); }
.tree-file-icon { display:flex; flex:none; color:var(--accent); }
.tree-file-name { flex:1; min-width:0; padding:0; color:var(--ink); font:600 11.5px var(--f-ui); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tree-file-add { width:25px; height:25px; flex:none; display:grid; place-items:center; padding:0; border:1px solid transparent; border-radius:6px; color:var(--muted); background:transparent; cursor:pointer; }
.tree-file-add:hover { color:var(--accent); border-color:var(--line); background:var(--surface); }
.tree-file-remove:hover { color:var(--danger); border-color:var(--danger); }
.tree-file-sync { width:25px; height:25px; flex:none; border:0; padding:0; display:grid; place-items:center; border-radius:6px; background:transparent; color:var(--ok); cursor:pointer; }
.tree-file-sync svg { width:15px; height:15px; }
.tree-file-sync[data-enabled="false"] { color:var(--danger); }
.tree-file-sync:hover { background:var(--bg); }
.tree-file-sync:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.tree-file-flows { padding:5px; display:grid; gap:2px; }
.tree-file-flows .tree-item { width:100%; padding-left:9px; font-size:12.5px; }

/* stage */
.stage { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
.crumbbar {
  display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--rule);
  background: var(--surface); min-width: 0; flex-wrap: wrap;
}
.crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; flex: 1 1 auto; flex-wrap: wrap; }
.crumb {
  border: 0; background: transparent; padding: 4px 7px; border-radius: 5px; cursor: pointer; color: var(--muted);
  font-weight: 500; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.crumb:hover { background: var(--bg); color: var(--ink); }
.crumb.cur { color: var(--ink); font-weight: 700; cursor: default; }
.crumb.cur:hover { background: transparent; }
.crumb-sep { color: var(--link); font: 12px var(--f-mono); }
.flow-select { display: none; max-width: 100%; }
.tools { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.tools .sep { width: 1px; height: 20px; background: var(--rule); margin: 0 4px; }
.zoomv { font: 11px var(--f-mono); color: var(--muted); min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.pbtn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 7px; height: 30px; padding: 0 10px;
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 600; font-size: 12.5px;
}
.pbtn:hover { border-color: var(--accent); color: var(--accent); }
.pbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pbtn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.pbtn.danger:hover { border-color: var(--danger); color: var(--danger); }
.pbtn.link { color: var(--link); border-color: color-mix(in srgb, var(--link) 45%, var(--line)); background: var(--link-soft); }
.pbtn.link:hover { border-color: var(--link); color: var(--link); }
.pbtn svg { width: 14px; height: 14px; }

.canvas-wrap {
  position: relative; overflow: auto; min-height: 0; background-color: var(--canvas);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 18px 18px;
  cursor: grab;
}
.canvas-wrap.panning, .canvas-wrap.panning * { cursor: grabbing !important; scroll-behavior: auto; }
.canvas-wrap.drop-target::after {
  content: 'Drop YAML files or a folder to open'; position: sticky; left: 50%; top: 50%; z-index: 12;
  display: block; width: max-content; transform: translate(-50%, -50%); padding: 12px 16px;
  border: 2px dashed var(--accent); border-radius: 10px; background: var(--surface); color: var(--accent);
  font-weight: 700; box-shadow: var(--shadow); pointer-events: none;
}
.canvas-inner { padding: 24px 16px 120px; width: max-content; min-width: 100%; position: relative; }
.inline-ed {
  position: absolute; z-index: 6; resize: none; overflow: hidden; padding: 2px 4px; margin: 0; line-height: 1.25;
  border: 1.5px solid var(--accent); border-radius: 5px; background: var(--surface); color: var(--ink);
  box-shadow: 0 0 0 4px var(--accent-soft); outline: none;
}
#diagram .editing .lb, #diagram .editing .hn { opacity: 0; }
#diagram.ctrl-held .lnk { cursor: pointer; }
.hd-acts button {
  width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--muted);
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.hd-acts button svg { width: 16px; height: 16px; }
.hd-acts button:hover:not(:disabled) { background: var(--bg); color: var(--ink); }
.hd-acts button.danger:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
.hd-acts button:disabled { opacity: .32; cursor: default; }
.hd-acts .sep { width: 1px; background: var(--rule); margin: 4px 2px; }
.anchor { fill: var(--surface); stroke: var(--accent); stroke-width: 2; cursor: ew-resize; }
.anchor:hover { fill: var(--accent); }
#diagram { display: block; user-select: none; -webkit-user-select: none; }
#diagram.enter { animation: drill .22s ease-out; }
@keyframes drill { from { opacity: .2; transform: scale(.975); transform-origin: 30% 0; } to { opacity: 1; transform: none; } }
.hint {
  position: sticky; left: 16px; bottom: 14px; margin: 0 16px 14px; width: fit-content; max-width: calc(100% - 32px);
  font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--rule);
  border-radius: 8px; padding: 6px 10px; display: flex; gap: 14px; flex-wrap: wrap;
}
.hint b { font-weight: 600; color: var(--ink); }
.hint-wrap { position: sticky; bottom: 0; left: 0; height: 0; overflow: visible; }
.hint-wrap .hint { position: absolute; bottom: 14px; left: 16px; margin: 0; }

/* svg diagram */
.lifeline { stroke: var(--faint); stroke-width: 1.25; stroke-dasharray: 5 5; }
.lane { fill: transparent; cursor: crosshair; touch-action: none; }
.lane:hover { fill: var(--accent-soft); fill-opacity: .55; }
.head { cursor: pointer; }
.mode-design .head, .mode-design .msg { cursor: grab; touch-action: none; }
.msg.dragging { opacity: .85; cursor: grabbing; }
.head .hd { fill: var(--surface); stroke: var(--ink); stroke-width: 1.3; }
.head .hd.dash { stroke-dasharray: 5 4; }
.head .fig { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; }
.head .figc { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
.head .hit { fill: transparent; }
.head .hn { fill: var(--ink); font: 600 13px var(--f-ui); text-anchor: middle; }
.head .ht { fill: var(--faint); font: 500 9.5px var(--f-mono); text-anchor: middle; letter-spacing: .06em; }
.head:hover .hd, .head:hover .fig, .head:hover .figc { stroke: var(--accent); }
.head.sel .hd, .head.sel .fig, .head.sel .figc { stroke: var(--accent); stroke-width: 2.2; }
.head.sel .hd { fill: var(--accent-soft); }
.head.dragging { opacity: .85; cursor: grabbing; }
.head .hn.lnk, .msg .lb.lnk { fill: var(--accent); text-decoration: underline; }
.mode-preview .lnk { cursor: pointer; }
.mode-preview .lnk:hover { fill: var(--ink); }
.head .hn.lnk-missing, .msg .lb.lnk-missing, .mode-preview .lnk-missing:hover { fill: var(--danger); text-decoration: underline; }
.mode-preview .lnk-missing { cursor: pointer; }
.msg { cursor: pointer; }
.msg .hit { fill: transparent; }
.msg .ln { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.msg.k-reply .ln { stroke-dasharray: 6 4; }
.msg .ah { fill: var(--ink); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
.msg .ah.open { fill: none; }
.msg .lb { fill: var(--ink); font: 500 12px var(--f-mono); }
.msg .num { fill: var(--surface); stroke: var(--line); }
.msg .numt { fill: var(--muted); font: 600 9.5px var(--f-mono); text-anchor: middle; font-variant-numeric: tabular-nums; }
.msg:hover .ln, .msg:hover .ah { stroke: var(--accent); }
.msg:hover .ah:not(.open) { fill: var(--accent); }
.msg.sel .hit { fill: var(--accent-soft); fill-opacity: .7; }
.msg.sel .ln, .msg.sel .ah { stroke: var(--accent); stroke-width: 2; }
.msg.sel .ah:not(.open) { fill: var(--accent); }
.msg.sel .lb { fill: var(--accent); }
.msg.sel .num { stroke: var(--accent); }
.ghost { cursor: pointer; }
.ghost rect { fill: transparent; stroke: var(--faint); stroke-dasharray: 4 4; stroke-width: 1.2; }
.ghost text { fill: var(--muted); font: 600 12.5px var(--f-ui); text-anchor: middle; }
.ghost:hover rect { stroke: var(--accent); fill: var(--accent-soft); }
.ghost:hover text { fill: var(--accent); }
.empty-t { fill: var(--muted); font: 500 12.5px var(--f-ui); }
.drag-ln { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; fill: none; }
.drag-dot { fill: var(--accent); }
.lane.target { fill: var(--accent-soft); fill-opacity: .9; }

/* yaml pane */
.yaml-pane { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; background: var(--surface); }
.yaml-host { min-height: 0; position: relative; }
.status {
  display: flex; align-items: center; gap: 10px; padding: 7px 16px; border-top: 1px solid var(--rule);
  font: 12px var(--f-mono); color: var(--muted); background: var(--panel); flex-wrap: wrap; min-width: 0;
}
.status .st { font-weight: 600; }
.status .st.ok { color: var(--ok); }
.status .st.err { color: var(--danger); }
.status .wr { color: var(--warn); }
.status .err-msg { color: var(--danger); min-width: 0; overflow-wrap: anywhere; }

/* inspector */
.insp {
  background: var(--panel); border-left: 1px solid var(--rule); display: grid;
  grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; min-width: 0;
}
.insp-top { padding: 14px 16px 12px; border-bottom: 1px solid var(--rule); overflow: auto; max-height: 56vh; }
.insp-hd { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 12px; }
.hd-acts { display: flex; gap: 1px; flex: none; margin-top: -2px; }
.insp-hd h2[contenteditable] { border-radius: 5px; padding: 1px 5px; margin-left: -5px; cursor: text; outline: none; }
.insp-hd h2[contenteditable]:hover { background: var(--bg); }
.insp-hd h2[contenteditable]:focus { background: var(--surface); box-shadow: 0 0 0 2px var(--accent); }
.insp-hd h2[contenteditable]:empty::before { content: attr(data-ph); color: var(--faint); }
.selrow { display: flex; gap: 6px; min-width: 0; }
.selrow select { flex: 1; min-width: 0; }
.sqbtn {
  flex: none; width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--line);
  border-radius: 6px; background: var(--surface); color: var(--accent); cursor: pointer; padding: 0;
}
.sqbtn:hover { border-color: var(--accent); background: var(--accent-soft); }
.sqbtn svg { width: 15px; height: 15px; }
.insp-hd .t { min-width: 0; flex: 1; }
.insp-hd h2 { margin: 2px 0 0; font-size: 17px; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; overflow-wrap: anywhere; text-wrap: balance; }

.seg { display: grid; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.seg button {

}

.ed-tabs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-width: 0; }
.ed-tab {

.ed-tab:hover { background: var(--bg); color: var(--ink); }

.ed-tab.bdg.on, .ed-tab.bdg.on:hover { background: var(--bc); border-color: var(--bc); color: var(--surface); }

.ed-add { width: 24px; height: 24px; border: 1px dashed var(--line); border-radius: 6px; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
.ed-add:hover { border-color: var(--accent); color: var(--accent); }
.ed-add svg { width: 13px; height: 13px; }
.badge-set { display: flex; align-items: center; gap: 8px; min-width: 0; }
.badge-set input { flex: 1; min-width: 0; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 0 8px; font: 12px var(--f-mono); }
.badge-set input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.notes-wrap { position: relative; min-height: 140px; margin: 0 10px 12px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); display: grid; grid-template-rows: minmax(0, 1fr) auto; }

.dialog {

.map-switch { flex:none; margin-left:2px; padding:6px 16px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); font-weight:700; cursor:pointer; }

.top { grid-template-columns: auto minmax(0, 1fr) auto auto auto; }

#mapSvg { display:block; min-width:100%; }

.map-node:hover .map-box { stroke:var(--accent); stroke-width:2.3; }

.map-node .map-sub { fill:var(--muted); font:11px var(--f-mono); }

.map-edge.missing { stroke:var(--danger); stroke-dasharray:6 4; }
.map-node, .map-edge { transition:opacity .15s ease; }
.map-node.map-dim, .map-edge.map-dim { opacity:.25; }
.map-node.map-related, .map-edge.map-related { opacity:.8; }
.map-node.map-focus { opacity:1; }
.map-edge.map-related { stroke-opacity:1; }
.map-edge.map-dim { stroke-opacity:1; }
.map-group-label { fill:var(--muted); font:700 12px var(--f-mono); }
.map-link-label { fill:var(--muted); font:10px var(--f-mono); }
@media (max-width:860px) { .top { grid-template-columns:auto minmax(0,1fr) auto auto; } .map-switch { grid-column:4; grid-row:1; } .actions { grid-column:3; grid-row:1; } }

  .flow-select { display: block; flex: 1 1 160px; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 0 6px; }

function headNeed(p, n) {
  if (p.type === 'actor') return 36 + n * HLH;
  if (p.type === 'external') return Math.max(L.headH, 28 + n * HLH);
  return Math.max(L.headH, 20 + n * HLH);
}
function computeLayout(f, design) {
  const n = f.participants.length;
  const xs = f.participants.map((_, i) => L.padX + L.col * i + L.col / 2);
  const idx = (id) => f.participants.findIndex((p) => p.id === id);
  const heads = f.participants.map((p) => wrapText(p.name, L.headW - (p.type === 'queue' ? 40 : 18), FONT_HN, 3));
  const hh = Math.max(L.headH, ...f.participants.map((p, i) => headNeed(p, heads[i].length)));
  const top = L.top;
  const firstY = top + hh + L.gap0;
  const ys = [], lines = [], loops = [], bls = [];
  let y = firstY, w = L.padX * 2 + L.col * Math.max(n + (design ? 1 : 0), 1);
  f.messages.forEach((m) => {
    const i1 = idx(m.from), i2 = idx(m.to);
    if (i1 === i2) {
      const ls = wrapText(m.label, SELF_W, FONT_LB);
      const loop = Math.max(26, ls.length * LH + 6);
      const bl = layoutBadges(m.badges, SELF_W + 40);
      lines.push(ls); loops.push(loop); ys.push(y); bls.push(bl);
      y += L.row + loop - 4 + bl.h;
      w = Math.max(w, xs[i1] + 52 + SELF_W + 24);
    } else {
      const ls = wrapText(m.label, Math.max(60, Math.abs(xs[i2] - xs[i1]) - 56), FONT_LB);
      y += (ls.length - 1) * LH;
      const bl = layoutBadges(m.badges, Math.max(60, Math.abs(xs[i2] - xs[i1]) - 24));
      lines.push(ls); loops.push(0); ys.push(y); bls.push(bl);
      y += L.row + bl.h;
    }
  });
  const endY = Math.max(y - L.row + L.bottom + 30, firstY + 70);
  return { xs, ys, lines, loops, bls, heads, hh, top, firstY, endY, w, h: endY + 12 };
}
function textBlock(lines, x, y0, lh, cls, anchor, link) {
  const r = resolveLink(link), hasLink = !!link, missing = hasLink && !r;
  const tsp = lines.map((l, k) => `<tspan x="${x}" y="${y0 + k * lh}">${esc(l)}</tspan>`).join('');
  const tooltip = missing ? `Missing link: ${esc(link)} (target file or flow is not loaded)` : r ? `${tab === 'design' ? 'Ctrl+click to open' : 'Open'} ${esc(r.entry.doc.flows[r.fid].name)} in ${esc(entryLabel(r.entry))}` : '';
  return `<text class="${cls}${hasLink ? ' lnk' : ''}${missing ? ' lnk-missing' : ''}"${hasLink ? ` data-link="${esc(link)}"` : ''} text-anchor="${anchor}">${tooltip ? `<title>${tooltip}</title>` : ''}${tsp}</text>`;
}

function headSvg(p, i) {
  const x = lay.xs[i], y = lay.top, w = L.headW, h = lay.hh, x0 = x - w / 2;
  const lines = lay.heads[i], n = lines.length;
  const isSel = sel && sel.kind === 'p' && sel.id === p.id;
  const mid = (top, bot) => (top + bot) / 2 - ((n - 1) * HLH) / 2 + 4.5;
  let shape = '', ty, tx = x, dotX = x0 + w - 9, dotY = y + 9;
  switch (p.type) {
    case 'actor':
      shape = `<rect class="hit" x="${x0}" y="${y}" width="${w}" height="${h}"/><circle class="figc" cx="${x}" cy="${y + 7}" r="5.5"/><path class="fig" d="M${x} ${y + 13}v11M${x - 9} ${y + 17}h18M${x} ${y + 24}l-7 8M${x} ${y + 24}l7 8"/>`;
      ty = y + 47; dotX = x + 18; break;
    case 'database':
      shape = `<path class="hd" d="M${x0} ${y + 7}a${w / 2} 7 0 0 1 ${w} 0V${y + h - 7}a${w / 2} 7 0 0 1 ${-w} 0Z"/><path class="hd" style="fill:none" d="M${x0} ${y + 7}a${w / 2} 7 0 0 0 ${w} 0"/>`;
      ty = mid(y + 14, y + h); dotY = y + 18; break;
    case 'queue':
      shape = `<rect class="hd" x="${x0}" y="${y}" width="${w}" height="${h}" rx="${Math.min(h / 2, 24)}"/><path class="hd" style="fill:none" d="M${x0 + w - 18} ${y + 3}v${h - 6}"/>`;
      ty = mid(y, y + h); tx = x - 9; dotX = x0 + w - 30; break;
    case 'external':
      shape = `<rect class="hd dash" x="${x0}" y="${y}" width="${w}" height="${h}" rx="3"/><text class="ht" x="${x}" y="${y + 15}">EXTERNAL</text>`;
      ty = mid(y + 16, y + h); break;
    default:
      shape = `<rect class="hd" x="${x0}" y="${y}" width="${w}" height="${h}" rx="7"/>`;
      ty = mid(y, y + h);
  }
  const dot = '';
  return `<g class="head${isSel ? ' sel' : ''}" data-kind="p" data-id="${esc(p.id)}" data-head="${i}"><title>${esc(p.name)}</title>${shape}${textBlock(lines, tx, ty, HLH, 'hn', 'middle', p.link)}${dot}</g>`;
}

function msgSvg(m, j) {
  const f = flow();
  const i1 = f.participants.findIndex((p) => p.id === m.from), i2 = f.participants.findIndex((p) => p.id === m.to);
  const x1 = lay.xs[i1], x2 = lay.xs[i2], y = lay.ys[j], lines = lay.lines[j], n = lines.length;
  const isSel = sel && sel.kind === 'm' && sel.id === m.id;
  const open = m.kind === 'async';
  const arrow = (tx, ty, dir) => open
    ? `<path class="ah open" d="M${tx - dir * 10} ${ty - 5}L${tx} ${ty}L${tx - dir * 10} ${ty + 5}"/>`
    : `<path class="ah" d="M${tx} ${ty}L${tx - dir * 10} ${ty - 4.5}L${tx - dir * 10} ${ty + 4.5}Z"/>`;
  const num = (cx, cy) => `<circle class="num" cx="${cx}" cy="${cy}" r="9"/><text class="numt" x="${cx}" y="${cy + 3.4}">${j + 1}</text>`;
  const maxLW = Math.max(0, ...lines.map((l) => tw(l, FONT_LB)));
  const lastW = tw(lines[n - 1], FONT_LB);
  let g, txt, hx0, hx1, hy0, hy1, dotX, dotY, bx0 = null, bcx = 0, by0 = 0;
  if (i1 === i2) {
    const lw = 42, hh = lay.loops[j], lx = x1 + 52, y0 = y + 12;
    g = `<path class="ln" d="M${x1} ${y}H${x1 + lw}V${y + hh}H${x1 + 2}"/>` + arrow(x1 + 1, y + hh, -1) + num(x1 - 16, y);
    txt = textBlock(lines, lx, y0, LH, 'lb', 'start', m.link);
    dotX = lx + lastW + 9; dotY = y0 + (n - 1) * LH - 4;
    hx0 = x1 - 28; hx1 = lx + maxLW + 18; hy0 = y - 12; hy1 = y + hh + 8;
    bx0 = x1 + 4; by0 = y + hh + 8;
  } else {
    const dir = x2 > x1 ? 1 : -1, cx = (x1 + x2) / 2, y0 = y - 8 - (n - 1) * LH;
    g = `<path class="ln" d="M${x1} ${y}H${x2 - dir * 2}"/>` + arrow(x2 - dir, y, dir) + num(x1 + dir * 16, y);
    txt = textBlock(lines, cx, y0, LH, 'lb', 'middle', m.link);
    dotX = cx + lastW / 2 + 9; dotY = y - 12;
    hx0 = Math.min(x1, x2) - 6; hx1 = Math.max(x1, x2) + 6; hy0 = y0 - 16; hy1 = y + 9;
    bcx = cx; by0 = y + 13;
  }
  const bl = lay.bls[j];
  if (bl.rows.length) {
    let by = by0;
    bl.rows.forEach((row) => {
      const rw = row.reduce((a, it) => a + it.w, 0) + BGAP * (row.length - 1);
      let bx = bx0 != null ? bx0 : bcx - rw / 2;
      row.forEach((it) => {
        const name = it.b.name || 'Untitled';
        const on = isSel && edTab === it.i;
        txt += `<g class="badge${on ? ' on' : ''}" data-badge="${it.i}" style="--bc:${esc(badgeColor(it.b.color))}"><title>${esc(name)}</title><rect x="${bx}" y="${by}" width="${it.w}" height="${BH}" rx="4"/><text x="${bx + 6}" y="${by + 10.6}">${esc(it.label)}</text></g>`;
        bx += it.w + BGAP;
      });
      by += BROW;
    });
    hy1 = Math.max(hy1, by0 + bl.h + 2);
  }
  if (isSel && tab === 'design') {
    const endY = i1 === i2 ? y + lay.loops[j] : y;
    lay.anchors = `<g data-kind="m" data-id="${esc(m.id)}"><circle class="anchor" data-anchor="from" cx="${x1}" cy="${y}" r="6"><title>Drag to another lifeline to change the sender</title></circle><circle class="anchor" data-anchor="to" cx="${x2}" cy="${endY}" r="6"><title>Drag to another lifeline to change the receiver</title></circle></g>`;
  }
  return `<g class="msg k-${m.kind}${isSel ? ' sel' : ''}" data-kind="m" data-id="${esc(m.id)}"><title>${esc(`${j + 1}. ${m.label || ''} (${KIND_LABEL[m.kind]})`)}</title><rect class="hit" x="${hx0}" y="${hy0}" width="${hx1 - hx0}" height="${hy1 - hy0}" rx="5"/>${g}${txt}</g>`;
}

function renderDiagram(animate) {
  if (inlineEd && !inlineEd.ta.isConnected) inlineEd = null;
  const f = flow(), design = tab === 'design';
  lay = computeLayout(f, design);
  let s = '';
  f.participants.forEach((p, i) => {
    const x = lay.xs[i];
    s += `<line class="lifeline" x1="${x}" y1="${lay.top + lay.hh}" x2="${x}" y2="${lay.endY}"/>`;
  });
  lay.anchors = '';
  f.messages.forEach((m, j) => { s += msgSvg(m, j); });
  if (design) f.participants.forEach((p, i) => {
    s += `<rect class="lane" data-lane="${i}" x="${lay.xs[i] - 9}" y="${lay.top + lay.hh + 4}" width="18" height="${lay.endY - lay.top - lay.hh - 4}"><title>Drag to another lifeline, or along this one, to add a step</title></rect>`;
  });
  s += lay.anchors;
  f.participants.forEach((p, i) => { s += headSvg(p, i); });
  if (design) {
    const x = L.padX + L.col * f.participants.length + L.col / 2;
    s += `<g class="ghost" data-act="addp"><rect x="${x - L.headW / 2}" y="${lay.top}" width="${L.headW}" height="${L.headH}" rx="7"/><text x="${x}" y="${lay.top + L.headH / 2 + 5}">+ Participant</text></g>`;
    if (f.participants.length >= 2 && !f.messages.length) s += `<text class="empty-t" x="${lay.xs[0] + 14}" y="${lay.firstY + 4}">Drag from one lifeline to another to add the first message.</text>`;
    if (f.participants.length === 1 && !f.messages.length) s += `<text class="empty-t" x="${lay.xs[0] + 14}" y="${lay.firstY + 4}">Add another participant, then drag between lifelines.</text>`;
  } else if (!f.participants.length) {
    s += `<text class="empty-t" x="${L.padX}" y="${lay.top + 20}">This flow is empty. Switch to Design to add participants.</text>`;
  }
  s += '<g id="dragLayer"></g>';
  const svg = $('#diagram');
  svg.setAttribute('viewBox', `0 0 ${lay.w} ${lay.h}`);
  svg.setAttribute('width', Math.round(lay.w * zoom));
  svg.setAttribute('height', Math.round(lay.h * zoom));
  svg.innerHTML = s;
  svg.classList.toggle('mode-design', design);
  svg.classList.toggle('mode-preview', !design);
  if (animate) { svg.classList.remove('enter'); void svg.getBoundingClientRect(); svg.classList.add('enter'); }
}

function flowOptions(current, exclude) {
  let o = `<option value="">None</option>`;
  const selected = resolveLink(current);
  for (const e of workspace) {
    const opts = Object.entries(e.doc.flows).filter(([id]) => !(e.key === activeFileKey && id === exclude)).map(([id, f]) => {
      const value = linkFor(e, id), on = selected ? selected.entry.key === e.key && selected.fid === id : value === current;
      return `<option value="${esc(value)}" ${on ? 'selected' : ''}>${esc(f.name)}</option>`;
    }).join('');
    if (opts) o += `<optgroup label="${esc(entryLabel(e))}">${opts}</optgroup>`;
  }
  if (current && !selected) o += `<option class="missing-link" value="${esc(current)}" selected>(missing) ${esc(current)}</option>`;
  o += `<option value="__new">New flow…</option>`;
  return o;
}

  if (design) {
    if (t.kind === 'p') {
      const idx = f.participants.indexOf(n);

        <div class="fld"><span>Shape</span>${seg('f-type', SHAPE_OPTS, n.type, 'Shape')}</div>

      </div>`;

      const r = resolveLink(item.link, n.file);

  const p = canvasPan; canvasPan = null; $('#canvasWrap').classList.remove('panning');
  if (p.clear && !p.moved && sel) select(null);
}
async function openDropped(dataTransfer) {
  const items = [], dirs = [];
  for (const item of [...(dataTransfer.items || [])]) {
    if (item.kind !== 'file') continue;
    let h = null;
    try { h = item.getAsFileSystemHandle ? await item.getAsFileSystemHandle() : null; } catch (_) {}
    if (h?.kind === 'directory') dirs.push(h);
    else if (h?.kind === 'file' && /\.ya?ml$/i.test(h.name)) items.push({ handle: h, path: h.name });
  }
  if (dirs.length) {
    const dir = dirs[0];
    try { await dir.requestPermission?.({ mode: 'readwrite' }); } catch (_) {}
    return loadHandleSet(await collectDirectory(dir), dir);
  }
  if (!items.length) for (const file of [...(dataTransfer.files || [])]) if (/\.ya?ml$/i.test(file.name)) items.push({ file, path: file.webkitRelativePath || file.name });
  return items.length ? loadHandleSet(items) : (toastError('Drop a .yaml or .yml file, or a folder containing them.'), false);
}

// ---------- wiring ----------
function wire() {
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
  $('#btnMap').addEventListener('click', () => setTab(tab === 'map' ? 'design' : 'map'));
  $('#mapReset').addEventListener('click', () => { $('#mapScroll').scrollTo(0,0); });
  $('#mapSvg').addEventListener('click', (e) => { const n=e.target.closest('[data-map-node]'); if(n)openMapFlow(n.dataset.mapNode); });
  $('#mapSvg').addEventListener('pointerover', (e) => { const n=e.target.closest('[data-map-node]'); if(n)highlightMapFlow(n.dataset.mapNode); });
  $('#mapSvg').addEventListener('pointerout', (e) => { const n=e.target.closest('[data-map-node]'); if(n && !n.contains(e.relatedTarget)) highlightMapFlow(null); });
  $('#btnUndo').addEventListener('click', undo);
  $('#btnRedo').addEventListener('click', redo);
  $('#btnFile').addEventListener('click', (e) => {
    e.stopPropagation();
    const m = $('#fileMenu'); m.hidden = !m.hidden; $('#btnFile').setAttribute('aria-expanded', String(!m.hidden));
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('#fileMenu')) { $('#fileMenu').hidden = true; $('#btnFile').setAttribute('aria-expanded', 'false'); } });
  $('#fileMenu').querySelectorAll('[data-cmd]').forEach((b) => b.addEventListener('click', () => fileCmd(b.dataset.cmd)));
  $('#fileChip').addEventListener('click', (event) => {
    if (event.target.closest('.file-sync')) { toggleFileSync(); return; }
    const e = activeEntry();
    if (event.target.closest('.st') && e && (e.state === 'blocked' || e.state === 'error')) saveFile();
  });
  if (!FS_API) document.querySelectorAll('.fs-only').forEach((b) => { b.hidden = true; });
  if (IN_FRAME) document.querySelectorAll('.dl-only').forEach((b) => { b.hidden = true; });
  window.addEventListener('beforeunload', (e) => { if (workspace.some((x) => x.dirty || x.writing)) { e.preventDefault(); e.returnValue = ''; } });
  $('#fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const ok = await loadHandleSet([{ file, path: file.name }]); e.target.value = '';
    if (fallbackFileResolve) { fallbackFileResolve(ok); fallbackFileResolve = null; }
  });
  $('#folderInput').addEventListener('change', async (e) => {
    const files = [...e.target.files].filter((f) => /\.ya?ml$/i.test(f.name));
    const ok = await loadHandleSet(files.map((file) => ({ file, path: file.webkitRelativePath || file.name }))); e.target.value = '';
    if (fallbackFolderResolve) { fallbackFolderResolve(ok); fallbackFolderResolve = null; }
  });
  $('#docTitle').addEventListener('input', (e) => { fitTitle(); commit(() => { doc.title = e.target.value; }, { key: 'title', inspector: false }); });
  $('#btnNewFile').addEventListener('click', openNewFileModal);
  $('#btnYamlFiles').addEventListener('click', () => { const open = $('#body').classList.toggle('yaml-files-open'); $('#btnYamlFiles').setAttribute('aria-expanded', String(open)); });
  wireEditorPane();
  const ctrlCursor = (e) => $('#diagram').classList.toggle('ctrl-held', tab === 'design' && (e.ctrlKey || e.metaKey));
  window.addEventListener('keydown', ctrlCursor); window.addEventListener('keyup', ctrlCursor); window.addEventListener('blur', () => $('#diagram').classList.remove('ctrl-held'));
  $('#tree').addEventListener('click', railClick);
  $('#flowSelect').addEventListener('change', (e) => { const x = decodeTarget(e.target.value); nav = [x]; activateEntry(x.fileKey); sel = null; render(true); renderDiagram(true); });
  $('#crumbs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-crumb]'); if (!b) return;
    const i = +b.dataset.crumb; if (i === nav.length - 1) return;
    nav = nav.slice(0, i + 1); activateEntry(nav[i].fileKey); sel = null; render(true); renderDiagram(true);
  });
  $('#tools').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tool]'); if (!b) return;
    const t = b.dataset.tool;
    if (t === 'addp') addParticipant();
    if (t === 'addm') addMessage();
    if (t === 'up' && nav.length > 1) { nav.pop(); activateEntry(nav[nav.length - 1].fileKey); sel = null; render(true); renderDiagram(true); }
    if (t === 'flowinfo') { sel = { kind: 'flow' }; render(true); }
    if (t === 'zin' || t === 'zout') setZoom(zoom + (t === 'zin' ? .1 : -.1));
  });
  const wrap = $('#canvasWrap');
  wrap.addEventListener('wheel', (e) => { e.preventDefault(); setZoom(zoom * Math.exp(-e.deltaY * .0015), e.clientX, e.clientY); }, { passive: false });
  wrap.addEventListener('pointerdown', canvasPanDown, true);
  wrap.addEventListener('pointermove', canvasPanMove);
  wrap.addEventListener('pointerup', canvasPanEnd);
  wrap.addEventListener('pointercancel', canvasPanEnd);
  const svg = $('#diagram');
  svg.addEventListener('pointerdown', onDown);
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerup', onUp);
  svg.addEventListener('pointercancel', () => { drag = null; renderDiagram(); });
  $('#modal').addEventListener('click', (e) => { if (e.target === $('#modal')) closeModal(); });
  document.addEventListener('keydown', (e) => {
    const inField = e.target.closest && e.target.closest('input, textarea, select, .monaco-editor, [contenteditable]');
    const cmdKey = (e.metaKey || e.ctrlKey) && !e.altKey ? e.key.toLowerCase() : '';
    if (e.code === 'Space' && !inField) { spaceHeld = true; wrap.classList.add('panning'); e.preventDefault(); }
    if (cmdKey === 's') { e.preventDefault(); e.shiftKey ? saveFileAs() : saveFile(); return; }
    if (cmdKey === 'o') { e.preventDefault(); openFile(); return; }
    if (e.key === 'Escape') { if (!$('#modal').hidden) return closeModal(); if (sel && !inField) { select(null); } return; }
    if (inField || !$('#modal').hidden) return;
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
    if (mod) return;
    if (e.key === '1') setTab('yaml');
    if (e.key === '2') setTab('design');
    if (e.key === '3') setTab('preview');
    if ((e.key === 'Delete' || e.key === 'Backspace') && sel) { e.preventDefault(); deleteSelected(); }
    if (e.key === 'Enter' && sel && sel.kind !== 'flow') { if (tab === 'design' && !(e.ctrlKey || e.metaKey)) { e.preventDefault(); startInlineEdit(sel); } else drill(sel); }
    if (e.key === 'F2' && sel && sel.kind !== 'flow' && tab === 'design') { e.preventDefault(); startInlineEdit(sel); }
  });
  document.addEventListener('keyup', (e) => { if (e.code === 'Space') { spaceHeld = false; if (!canvasPan) wrap.classList.remove('panning'); } });
  window.addEventListener('blur', () => { spaceHeld = false; canvasPan = null; wrap.classList.remove('panning'); });
  document.addEventListener('dragover', (e) => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); wrap.classList.add('drop-target'); } });
  document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) wrap.classList.remove('drop-target'); });
  document.addEventListener('drop', (e) => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); wrap.classList.remove('drop-target'); openDropped(e.dataTransfer); } });
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  mq.addEventListener && mq.addEventListener('change', applyMonacoTheme);
  new MutationObserver(applyMonacoTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  window.matchMedia('(max-width: 860px)').addEventListener?.('change', () => layoutClasses());
  setInterval(refreshWorkspace, 1600);
}
function removeWorkspaceFile(key) {
  const e = entryByKey(key);
  if (!e) return;
  const linked = !!(e.handle || e.file || e.inDirectory);
  const name = entryLabel(e);
  confirmModal(linked ? `Unlink ${name}?` : `Delete ${name}?`,
    linked ? 'Remove this file from the workspace without deleting the file from your computer.' : 'Delete this browser-only file and its flows from browser storage?',
    linked ? 'Unlink' : 'Delete', () => {
      clearTimeout(e.saveT);

      workspace = workspace.filter(x => x !== e);
      // Keep the folder handle even when its final visible file is unlinked.
      // Resuming sync can then discover every file in the folder again.
      if (!workspace.length) {
        const raw = { title:'Untitled diagram', flows:{ main:{ name:'Main flow', participants:[], messages:[] } } };
        const fresh = makeFileEntry({ name:'diagram.yaml', path:'diagram.yaml', text:jsyaml.dump(raw), doc:normalize(raw).doc });
        workspace = [fresh];
      }
      const next = entryByKey(activeFileKey) || workspace[0];
      activeFileKey = next.key;
      doc = next.doc;
      nav = [target(next.key, Object.keys(next.doc.flows)[0])];
      sel = null; undoStack = []; redoStack = [];
      yamlDirty = true; yamlInvalid = false;
      fileSyncEnabled = fileSyncEnabled && (!!directoryHandle || workspace.some(x => x.handle));
      persistBrowserWorkspace();
      if (tab === 'yaml') syncYaml();
      setFileState(next.state || 'saved');
      render(true);
      toast(linked ? 'File unlinked. The disk file was not deleted.' : 'Browser file deleted.');
    });
}
async function toggleEntrySync(key) {
  const e = entryByKey(key);
  if (!e?.handle) return;
  const path = entryKey(e.path);
  if (perFilePaused.has(path)) {
    perFilePaused.delete(path);
    if (fileSyncEnabled) {
      try {
        if (await e.handle.queryPermission({mode:'readwrite'}) !== 'granted' && await e.handle.requestPermission({mode:'readwrite'}) !== 'granted') {
          perFilePaused.add(path); toastError('File access not granted.'); renderRail(); return;
        }
      } catch (_) { perFilePaused.add(path); toastError('File access not granted.'); renderRail(); return; }
      if (e.dirty) scheduleFileSave(e); else await refreshEntry(e);
    }
    toast('File sync enabled.');
  } else {
    perFilePaused.add(path); clearTimeout(e.saveT); e.state = 'paused';
    toast('File sync paused.');
  }
  await storeHandles(); render(true); setFileState(activeEntry()?.state || 'saved');
}
function railClick(e) {
  const sync = e.target.closest('[data-sync-file]');
  if (sync) { void toggleEntrySync(sync.dataset.syncFile); return; }
  const remove = e.target.closest('[data-remove-file]');
  if (remove) { removeWorkspaceFile(remove.dataset.removeFile); return; }
  const add = e.target.closest('[data-add-flow]');
  if (add) { addFlow(add.dataset.addFlow); return; }
  const b = e.target.closest('[data-flow]'); if (!b) return;
  if (tab === 'yaml' && yamlT) { clearTimeout(yamlT); yamlT = null; if (yamlEd) applyYaml(yamlEd.get()); }
  $('#body').classList.remove('yaml-files-open');
  $('#btnYamlFiles').setAttribute('aria-expanded', 'false');
  nav = [target(b.dataset.file, b.dataset.flow)]; activateEntry(b.dataset.file); sel = null; render(true); renderDiagram(true);
}

// ---------- boot ----------
function showStartupChoice() {
  const d = openModal(`<h3>Open a workspace</h3><p>Choose how to start working in Lifeline.</p><div class="foot" style="flex-wrap:wrap"><button class="pbtn" id="startup-folder">Open folder…</button><button class="pbtn" id="startup-file">Open file…</button><button class="pbtn primary" id="startup-browser">Use browser storage</button></div>`);
  const choose = async (fn) => { const ok = await fn(); if (ok) closeModal(); };
  d.querySelector('#startup-folder').addEventListener('click', () => choose(openFolder));
  d.querySelector('#startup-file').addEventListener('click', () => choose(openFile));
  d.querySelector('#startup-browser').addEventListener('click', () => { closeModal(); persistBrowserWorkspace(); });
}
async function boot() {
  const BLANK = 'title: Untitled diagram\nflows:\n  main:\n    name: Main flow\n    participants: []\n    messages: []\n';
  let loaded = normalize(jsyaml.load(BLANK));
  doc = loaded.doc; lastWarnings = loaded.warnings;
  const initial = makeFileEntry({ name: 'browser.yaml', path: 'browser.yaml', text: BLANK, doc, warnings: lastWarnings });
  workspace = [initial]; activeFileKey = initial.key; nav = [target(initial.key, firstFlow())];
  try {
    const stored = JSON.parse(localStorage.getItem(STORE_FILES) || 'null');
    let drafts = stored?.files || [];
    if (!drafts.length && localStorage.getItem(STORE)) drafts = [{ name: 'browser.yaml', path: 'browser.yaml', text: localStorage.getItem(STORE) }];
    if (drafts.length) {
      const entries = drafts.map(f => {
        const parsed = normalize(jsyaml.load(f.text));
        return makeFileEntry({ name: f.name, path: f.path, text: f.text, doc: parsed.doc, warnings: parsed.warnings });
      });
      workspace = uniqueEntryKeys(entries);
      const chosen = entryByKey(stored?.active) || workspace[0];
      activeFileKey = chosen.key; doc = chosen.doc; lastWarnings = chosen.warnings;
      nav = [target(chosen.key, Object.keys(doc.flows)[0])];
      hasBrowserDrafts = true;
    }
  } catch (_) {}
  try { const t = localStorage.getItem(STORE_TAB); if (['yaml', 'design', 'preview', 'map'].includes(t)) tab = t; } catch (_) {}
  if (isNarrow()) zoom = .8;
  await restoreHandles();
  wire(); render(true); setStatus(); updateRestore(); loadMonaco();
  if (!hasBrowserDrafts && !restoredFileWorkspace) showStartupChoice();
}
if (typeof jsyaml === 'undefined') {
  document.getElementById('app').innerHTML = '<p style="padding:24px">The YAML library could not load. Check your connection and reload the page.</p>';
} else boot();
})();
</script>
