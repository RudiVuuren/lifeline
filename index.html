<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lifeline: plan systems as linked sequence-diagram flows stored as YAML and Markdown in a folder.">
<title>Lifeline Sequence Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style id="monaco-css"></style>
<style>
:root {
  --bg: #e8ecf0;
  --panel: #f5f7f9;
  --surface: #fcfdfe;
  --canvas: #f1f4f7;
  --dot: #d0d7e0;
  --ink: #17202c;
  --muted: #5a6577;
  --faint: #8c96a6;
  --line: #cdd4dd;
  --rule: #dde2e8;
  --accent: #2646cf;
  --accent-ink: #ffffff;
  --accent-soft: #e2e7fb;
  --link: #b2500d;
  --link-soft: #fbede1;
  --note: #e0760b;
  --b-blue: #2453c9; --b-green: #1f7a4d; --b-orange: #b85c00; --b-red: #c0392b; --b-purple: #7a3fc4; --b-teal: #0f7f86; --b-gray: #5a6577;
  --ok: #1f7a4d;
  --warn: #9a6200;
  --danger: #b42323;
  --shadow: 0 10px 30px rgba(23, 32, 44, .14);
  --f-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1116; --panel: #131820; --surface: #19202a; --canvas: #10151b; --dot: #232b36;
    --ink: #e3e8ef; --muted: #98a3b4; --faint: #6c7788; --line: #333c49; --rule: #242c37;
    --accent: #8d9fff; --accent-ink: #0d1116; --accent-soft: #222b4c; --link: #f1a25c; --link-soft: #3a2716; --note: #ff9a3c;
    --b-blue: #8fa8ff; --b-green: #5fcf95; --b-orange: #f2a65a; --b-red: #ff8a80; --b-purple: #c39bff; --b-teal: #5fd0d6; --b-gray: #a3adbb;
    --ok: #5fcf95; --warn: #e9b44c; --danger: #ff7c7c; --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1116; --panel: #131820; --surface: #19202a; --canvas: #10151b; --dot: #232b36;
  --ink: #e3e8ef; --muted: #98a3b4; --faint: #6c7788; --line: #333c49; --rule: #242c37;
  --accent: #8d9fff; --accent-ink: #0d1116; --accent-soft: #222b4c; --link: #f1a25c; --link-soft: #3a2716; --note: #ff9a3c;
  --b-blue: #8fa8ff; --b-green: #5fcf95; --b-orange: #f2a65a; --b-red: #ff8a80; --b-purple: #c39bff; --b-teal: #5fd0d6; --b-gray: #a3adbb;
  --ok: #5fcf95; --warn: #e9b44c; --danger: #ff7c7c; --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-ui); overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

.top {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto; align-items: center; gap: 14px;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -.01em; font-size: 15px; }
.brand svg { display: block; }
.title-wrap { display: flex; align-items: center; gap: 6px; min-width: 0; }
.file-chip {
  display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 300px; flex: 0 1 auto; height: 26px;
  padding: 0 9px; border: 1px solid var(--rule); border-radius: 13px; background: var(--surface); color: var(--muted);
  font: 500 11.5px var(--f-mono); cursor: default; white-space: nowrap;
}
.file-chip .fn { overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.file-chip .st { cursor: pointer; }
.file-sync { width: 17px; height: 20px; flex: none; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: var(--ok); cursor: pointer; }
.file-sync svg { width: 15px; height: 15px; }
.file-sync[data-enabled="false"] { color: var(--danger); }
.file-chip[data-state="blocked"], .file-chip[data-state="error"] { border-color: var(--danger); }
.file-chip[data-state="blocked"] .file-sync, .file-chip[data-state="error"] .file-sync, .file-chip[data-state="blocked"] .st, .file-chip[data-state="error"] .st { color: var(--danger); }
.file-chip[data-state="memory"] .st { color: var(--accent); text-decoration: underline; }
.doc-title {
  min-width: 0; width: 100%; max-width: 360px; border: 1px solid transparent; background: transparent;
  padding: 5px 8px; border-radius: 6px; font-weight: 500; color: var(--muted);
}
.title-wrap .doc-title { width: auto; flex: 0 1 auto; }
.doc-title:hover:not([readonly]) { border-color: var(--line); }
.doc-title:focus:not([readonly]) { border-color: var(--accent); color: var(--ink); background: var(--surface); outline: none; }
.doc-title[readonly] { cursor: default; }
.tabs { display: flex; background: var(--bg); border: 1px solid var(--rule); border-radius: 9px; padding: 3px; gap: 2px; }
.tab {
  border: 0; background: transparent; padding: 5px 14px; border-radius: 6px; cursor: pointer;
  font-weight: 600; color: var(--muted); font-size: 13px; display: flex; gap: 7px; align-items: center;
}
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.actions { display: flex; gap: 4px; align-items: center; position: relative; }
.ibtn {
  border: 1px solid transparent; background: transparent; border-radius: 7px; height: 32px; min-width: 32px;
  padding: 0 9px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
  color: var(--muted); font-weight: 500; font-size: 13px;
}
.ibtn:hover:not(:disabled) { background: var(--bg); color: var(--ink); border-color: var(--rule); }
.ibtn:disabled { opacity: .38; cursor: default; }
.ibtn svg { width: 16px; height: 16px; flex: none; }
.problems-btn[data-level="ok"] { color: var(--ok); }
.problems-btn[data-level="warning"] { color: var(--warn); }
.problems-btn[data-level="error"] { color: var(--danger); }
.menu {
  position: absolute; right: 0; top: 38px; z-index: 30; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow); padding: 6px; min-width: 250px; display: grid;
}
.menu button {
  border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer;
  display: flex; justify-content: space-between; gap: 12px;
}
.menu button:hover:not(:disabled) { background: var(--accent-soft); }
.menu button:disabled { opacity: .4; cursor: default; }
.menu button small { color: var(--faint); font: 11px var(--f-mono); }
.menu hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 2px; }

.body { --rail-width: 300px; display: grid; position: relative; grid-template-columns: var(--rail-width) minmax(0, 1fr) 360px; min-height: 0; }
.body.no-insp { grid-template-columns: var(--rail-width) minmax(0, 1fr); }
.body.no-insp .insp { display: none; }
.rail-resizer { position: absolute; left: calc(var(--rail-width) - 5px); top: 0; bottom: 0; width: 10px; z-index: 20; cursor: col-resize; touch-action: none; background: transparent; }
.rail-resizer::after { content: ''; position: absolute; top: 0; bottom: 0; left: 4px; width: 2px; background: var(--accent); opacity: 0; transition: opacity .15s; }
.rail-resizer:hover::after, .rail-resizer:focus-visible::after, .body.rail-resizing .rail-resizer::after { opacity: .8; }
.body.rail-resizing, .body.rail-resizing * { cursor: col-resize !important; user-select: none !important; }
.body.mode-map .rail-resizer { display: none; }

.rail { background: var(--panel); border-right: 1px solid var(--rule); overflow: auto; padding: 14px 10px 20px; min-width: 0; }
.rail-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 6px 10px; }
.eyebrow { font: 600 10.5px var(--f-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-new-file { display: inline-flex; flex: none; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; background: var(--surface); color: var(--accent); font-size: 11px; font-weight: 700; cursor: pointer; }
.rail-new-file:hover { border-color: var(--accent); background: var(--accent-soft); }
.rail-new-file svg { width: 15px; height: 15px; }
.tree { display: grid; gap: 1px; }
.tree-row { display: flex; align-items: center; gap: 2px; min-width: 0; }
.tree-dir {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 5px 6px;
  border-radius: 6px; cursor: pointer; color: var(--muted); font: 600 11.5px var(--f-mono); text-align: left;
}
.tree-dir:hover { background: var(--bg); color: var(--ink); }
.tree-dir .chev { width: 12px; flex: none; color: var(--faint); text-align: center; }
.tree-dir .dn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-add { width: 24px; height: 24px; flex: none; display: grid; place-items: center; padding: 0; border: 1px solid transparent; border-radius: 6px; color: var(--faint); background: transparent; cursor: pointer; opacity: 0; }
.tree-row:hover .tree-add, .tree-add:focus-visible { opacity: 1; }
.tree-add:hover { color: var(--accent); border-color: var(--line); background: var(--surface); }
.tree-add svg { width: 13px; height: 13px; }
.tree-add.tree-del:hover { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
.tree-kids { margin-left: 11px; padding-left: 6px; border-left: 1px solid var(--rule); display: grid; gap: 1px; }
.tree-item {
  width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 7px;
  border: 0; background: transparent; text-align: left; padding: 5px 8px; border-radius: 6px; cursor: pointer; color: var(--ink); font: 500 12px var(--f-mono);
}
.tree-item:hover { background: var(--bg); }
.tree-item .gl { display: flex; color: var(--faint); }
.tree-item .gl svg { width: 14px; height: 14px; }
.tree-item .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-item .dot { width: 7px; height: 7px; border-radius: 50%; }
.tree-item .dot.error { background: var(--danger); }
.tree-item .dot.warning { background: var(--warn); }
.tree-item.active { background: var(--accent-soft); font-weight: 700; }
.tree-item.active .gl { color: var(--accent); }
.tree-item.broken .nm { color: var(--danger); }
.tree-rename { min-width: 0; width: 100%; height: 22px; padding: 0 5px; border: 1px solid var(--accent); border-radius: 4px; background: var(--surface); font: 500 12px var(--f-mono); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.tree-empty { padding: 8px; color: var(--faint); font-size: 12.5px; }
.rail-btns { display: flex; gap: 4px; flex: none; }
.rail-new-file:disabled { opacity: .45; cursor: default; }
.tree { min-height: 40px; border-radius: 6px; }
.tree.drop-root { outline: 1.5px dashed var(--accent); outline-offset: 3px; background: color-mix(in srgb, var(--accent-soft) 40%, transparent); }
.tree-dir.drop { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.tree-item.dragging, .tree-dir.dragging { opacity: .45; }
.tree-item.pending, .tree-row.pending .tree-dir { cursor: default; }
.tree-item.pending:hover, .tree-row.pending .tree-dir:hover { background: transparent; }

.stage { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
.crumbbar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--rule); background: var(--surface); min-width: 0; flex-wrap: wrap; }
.crumbs { display: flex; align-items: center; gap: 0.75px; min-width: 0; flex: 1 1 auto; flex-wrap: wrap; }
.crumb {
  --notch: 11px;
  border: 0; height: 30px; padding: 0 calc(var(--notch) + 10px) 0 calc(var(--notch) + 12px); border-radius: 6px; cursor: pointer;
  background: var(--bg); color: var(--muted); font-weight: 600; font-size: 13px; max-width: 240px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  clip-path: polygon(0 0, calc(100% - var(--notch)) 0, 100% 50%, calc(100% - var(--notch)) 100%, 0 100%, var(--notch) 50%);
}
.crumb:first-child { padding-left: 14px; clip-path: polygon(0 0, calc(100% - var(--notch)) 0, 100% 50%, calc(100% - var(--notch)) 100%, 0 100%); }
.crumb:hover { background: var(--line); color: var(--ink); }
.crumb.cur { background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: default; }
.crumb.cur:hover { background: var(--accent); }
.flow-select { display: none; max-width: 100%; }
.tools { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.zoomv { font: 11px var(--f-mono); color: var(--muted); min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.tree-row > .tree-item { flex: 1; min-width: 0; }
.pbtn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 7px; height: 30px; padding: 0 10px;
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 600; font-size: 12.5px;
}
.pbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pbtn:disabled { opacity: .45; cursor: default; }
.pbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pbtn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.pbtn svg { width: 14px; height: 14px; }

.canvas-wrap {
  position: relative; overflow: auto; min-height: 0; background-color: var(--canvas);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 18px 18px; cursor: grab;
}
.canvas-wrap.panning, .canvas-wrap.panning * { cursor: grabbing !important; scroll-behavior: auto; }
.canvas-inner { padding: 24px 16px 120px; width: max-content; min-width: 100%; position: relative; }
.inline-ed {
  position: absolute; z-index: 6; resize: none; overflow: hidden; padding: 2px 4px; margin: 0; line-height: 1.25;
  border: 1.5px solid var(--accent); border-radius: 5px; background: var(--surface); color: var(--ink);
  box-shadow: 0 0 0 4px var(--accent-soft); outline: none;
}
#diagram .editing .lb, #diagram .editing .hn, #diagram .editing .fr-cond { opacity: 0; }
#diagram.ctrl-held .lnk { cursor: pointer; }
.hd-acts button {
  width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--muted);
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.hd-acts button svg { width: 16px; height: 16px; }
.hd-acts button:hover:not(:disabled) { background: var(--bg); color: var(--ink); }
.hd-acts button.danger:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
.hd-acts button:disabled { opacity: .32; cursor: default; }
.hd-acts .sep { width: 1px; background: var(--rule); margin: 4px 2px; }
.anchor { fill: var(--surface); stroke: var(--accent); stroke-width: 2; cursor: ew-resize; }
.anchor:hover { fill: var(--accent); }
#diagram { display: block; user-select: none; -webkit-user-select: none; }
#diagram.enter { animation: drill .22s ease-out; }
@keyframes drill { from { opacity: .2; transform: scale(.975); transform-origin: 30% 0; } to { opacity: 1; transform: none; } }

.lifeline { stroke: var(--faint); stroke-width: 1.25; stroke-dasharray: 5 5; }
.lane { fill: transparent; cursor: crosshair; touch-action: none; }
.lane:hover { fill: var(--accent-soft); fill-opacity: .55; }
.head { cursor: pointer; }
.mode-design .head, .mode-design .msg { cursor: grab; touch-action: none; }
.msg.dragging { opacity: .85; cursor: grabbing; }
.head .hd { fill: var(--surface); stroke: var(--ink); stroke-width: 1.3; }
.head .hd.dash { stroke-dasharray: 5 4; }
.head .fig { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; }
.head .figc { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
.head .hit { fill: transparent; }
.head .hn { fill: var(--ink); font: 600 13px var(--f-ui); text-anchor: middle; }
.head .ht { fill: var(--faint); font: 500 9.5px var(--f-mono); text-anchor: middle; letter-spacing: .06em; }
.head:hover .hd, .head:hover .fig, .head:hover .figc { stroke: var(--accent); }
.head.sel .hd, .head.sel .fig, .head.sel .figc { stroke: var(--accent); stroke-width: 2.2; }
.head.sel .hd { fill: var(--accent-soft); }
.head.dragging { opacity: .85; cursor: grabbing; }
.head .hn.lnk, .msg .lb.lnk { fill: var(--accent); text-decoration: underline; }
.mode-preview .msg, .mode-preview .head, .mode-preview .badge, .mode-preview .frag .fr-hit { cursor: default; }
.mode-preview .lnk { cursor: pointer; }
.mode-preview .lnk:hover { fill: var(--ink); }
.head .hn.lnk-missing, .msg .lb.lnk-missing { fill: var(--danger); text-decoration: underline; }
.msg { cursor: pointer; }
.msg .hit { fill: transparent; }
.msg .ln { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.msg.k-reply .ln { stroke-dasharray: 6 4; }
.msg .ah { fill: var(--ink); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
.msg .ah.open { fill: none; }
.msg .lb { fill: var(--ink); font: 500 12px var(--f-mono); }
.msg .num { fill: var(--surface); stroke: var(--line); }
.msg .numt { fill: var(--muted); font: 600 9.5px var(--f-mono); text-anchor: middle; font-variant-numeric: tabular-nums; }
.msg:hover .ln, .msg:hover .ah { stroke: var(--accent); }
.msg:hover .ah:not(.open) { fill: var(--accent); }
.msg.sel .hit { fill: var(--accent-soft); fill-opacity: .7; }
.msg.sel .ln, .msg.sel .ah { stroke: var(--accent); stroke-width: 2; }
.msg.sel .ah:not(.open) { fill: var(--accent); }
.msg.sel .lb { fill: var(--accent); }
.msg.sel .num { stroke: var(--accent); }
.ghost { cursor: pointer; }
.ghost rect { fill: transparent; stroke: var(--faint); stroke-dasharray: 4 4; stroke-width: 1.2; }
.ghost text { fill: var(--muted); font: 600 12.5px var(--f-ui); text-anchor: middle; }
.ghost:hover rect { stroke: var(--accent); fill: var(--accent-soft); }
.ghost:hover text { fill: var(--accent); }
.empty-t { fill: var(--muted); font: 500 12.5px var(--f-ui); }
.drag-ln { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; fill: none; }
.drag-dot { fill: var(--accent); }
.marquee { fill: var(--accent-soft); fill-opacity: .35; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
.marquee-hit .ln { stroke: var(--accent); }
.lane.target { fill: var(--accent-soft); fill-opacity: .9; }
.badge { cursor: pointer; }
.badge rect { fill: var(--bc); fill-opacity: .13; stroke: var(--bc); stroke-opacity: .5; stroke-width: 1; }
.badge text { fill: var(--bc); font: 600 9.5px var(--f-mono); }
.badge:hover rect, .badge.on rect { fill-opacity: .26; stroke-opacity: 1; }

.frag .fr-box { fill: var(--accent-soft); fill-opacity: .16; stroke: var(--muted); stroke-width: 1.1; pointer-events: none; }
.frag .fr-tag { fill: var(--surface); stroke: var(--muted); stroke-width: 1.1; pointer-events: none; }
.frag .fr-op { fill: var(--ink); font: 700 10px var(--f-mono); letter-spacing: .04em; pointer-events: none; }
.frag .fr-cond { fill: var(--muted); font: 600 11.5px var(--f-mono); pointer-events: none; }
.frag .fr-more { fill: var(--faint); font: 500 11px var(--f-mono); pointer-events: none; }
.frag .fr-sep { stroke: var(--muted); stroke-width: 1.1; stroke-dasharray: 5 4; pointer-events: none; }
.frag .fr-hit { fill: transparent; cursor: pointer; }
.frag:hover .fr-box, .frag:hover .fr-tag { stroke: var(--accent); }
.frag.sel .fr-box, .frag.sel .fr-tag { stroke: var(--accent); stroke-width: 2; }
.frag.sel .fr-op, .frag.sel .fr-cond { fill: var(--accent); }
.frag.collapsed .fr-box { fill-opacity: .4; }
.fr-toggle { cursor: pointer; }
.fr-toggle rect { fill: var(--surface); stroke: var(--line); }
.fr-toggle text { fill: var(--muted); font: 700 12px var(--f-mono); text-anchor: middle; pointer-events: none; }
.fr-toggle:hover rect { stroke: var(--accent); }
.fr-toggle:hover text { fill: var(--accent); }

.flow-notes { position: relative; margin: 8px 0 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: default; user-select: text; }
.flow-notes.editable { cursor: text; }
.flow-notes.editable:hover { border-color: var(--accent); }
.flow-notes.empty { border-style: dashed; background: transparent; }
.flow-notes .fn-ph { padding: 14px 18px; color: var(--faint); font-size: 13px; }
.flow-notes .md { max-width: none; margin: 0; padding: 14px 20px 6px; }

.flow-notes .fn-tag { position: absolute; z-index: 20; top: -9px; left: 14px; padding: 0 6px; background: var(--canvas); color: var(--faint); font: 600 10.5px var(--f-mono); letter-spacing: .08em; pointer-events: none; }
.flow-notes.editing .fn-tag { color: var(--accent); }

.doc-view { overflow: auto; min-height: 0; background: var(--surface); }
.md { max-width: 780px; margin: 0 auto; padding: 28px 32px 90px; line-height: 1.6; overflow-wrap: anywhere; }

.md h1 { font-size: 26px; letter-spacing: -.01em; margin: 0 0 14px; }

.yaml-pane { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; background: var(--surface); }

.insp { background: var(--panel); border-left: 1px solid var(--rule); display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; min-width: 0; }

.sqbtn { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--accent); cursor: pointer; padding: 0; }
.sqbtn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.sqbtn:disabled { opacity: .4; cursor: default; }
.sqbtn svg { width: 15px; height: 15px; }
.insp-hd .t { min-width: 0; flex: 1; }
.insp-hd h2 { margin: 2px 0 0; font-size: 17px; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; overflow-wrap: anywhere; text-wrap: balance; }
.kind-tag { font: 600 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.fields { display: grid; gap: 12px; }
.fld { display: grid; gap: 4px; min-width: 0; }

.seg { display: grid; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

.seg button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg button svg { width: 26px; height: 14px; }
.seg .dir-arrow { font: 700 17px/14px var(--f-mono); }
.seg button:hover { color: var(--ink); background: var(--bg); }
.seg button[aria-checked="true"] { background: var(--accent-soft); color: var(--accent); }
.fld.inline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.step-controls { display: flex; align-items: stretch; gap: 7px; }
.style-toggle { width: 38px; min-width: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 0; background: var(--surface); color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.style-toggle:hover { border-color: var(--accent); color: var(--ink); }
.style-toggle[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.style-toggle svg { width: 23px; height: 14px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
.cases { display: grid; gap: 6px; }
.case-row { display: flex; gap: 6px; align-items: center; }
.meta { font: 11.5px var(--f-mono); color: var(--muted); display: grid; gap: 3px; }
.meta b { color: var(--ink); font-weight: 600; }
.ref { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 6px 8px; text-align: left; cursor: pointer; font-size: 12.5px; display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.ref:hover { border-color: var(--link); }
.ref span { color: var(--faint); font: 11px var(--f-mono); }
.ed-head { display: grid; gap: 6px; padding: 10px 10px 6px; min-width: 0; }
.ed-tabs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-width: 0; }
.ed-tab { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 3px 8px; cursor: pointer; font: 600 11px var(--f-mono); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; max-width: 100%; }
.ed-tab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-tab:hover { background: var(--bg); color: var(--ink); }
.ed-tab[aria-selected="true"] { background: var(--surface); border-color: var(--line); color: var(--ink); }
.ed-tab.bdg { color: var(--bc); padding: 0; gap: 0; border-color: color-mix(in srgb, var(--bc) 45%, transparent); background: transparent; }
.ed-tab.bdg:hover { background: color-mix(in srgb, var(--bc) 10%, transparent); color: var(--bc); }
.ed-tab.bdg > button { border: 0; background: transparent; color: inherit; font: inherit; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; cursor: pointer; min-width: 0; border-radius: 5px; }
.ed-tab.bdg > button[role="tab"]:has(+ .bx) { padding-right: 3px; }
.ed-tab.bdg .bx { padding: 3px 7px 3px 3px; font-size: 13px; line-height: 1; opacity: .65; }
.ed-tab.bdg .bx:hover { opacity: 1; }
.ed-tab.bdg i { width: 7px; height: 7px; border-radius: 2px; background: var(--bc); flex: none; }
.ed-tab.bdg.on, .ed-tab.bdg.on:hover { background: var(--bc); border-color: var(--bc); color: var(--surface); }
.ed-tab.bdg.on i { background: var(--surface); }
.ed-add { width: 24px; height: 24px; border: 1px dashed var(--line); border-radius: 6px; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
.ed-add:hover { border-color: var(--accent); color: var(--accent); }
.ed-add svg { width: 13px; height: 13px; }
.badge-set { display: flex; align-items: center; gap: 8px; min-width: 0; }
.badge-set input { flex: 1; min-width: 0; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 0 8px; font: 12px var(--f-mono); }
.badge-set input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.swatches { display: flex; gap: 4px; flex: none; }
.swatches button { width: 15px; height: 15px; border-radius: 50%; border: 0; padding: 0; background: var(--bc); cursor: pointer; }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--bc); }
.notes-wrap { position: relative; min-height: 140px; margin: 0 10px 12px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.notes-host { position: relative; min-height: 0; }
.notes-view { position: absolute; inset: 0; z-index: 1; overflow: auto; margin: 0; max-width: none; padding: 12px 14px; font-size: 13.5px; background: var(--surface); }
.hover-tip { position: fixed; z-index: 55; max-width: 440px; max-height: 50vh; overflow: auto; overscroll-behavior: contain; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); font-size: 13px; user-select: text; }
.hover-tip.pinned { border-color: var(--accent); }
.hover-tip .tip-h { margin: 0 0 6px; color: var(--faint); font: 600 10.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.hover-tip .md { margin: 0; padding: 0; max-width: none; line-height: 1.5; }
.hover-tip .md > :last-child { margin-bottom: 0; }
.notes-wrap.ro .monaco-editor .cursors-layer, .notes-wrap.ro .monaco-editor .current-line { display: none !important; }
.notes-wrap.ro .fallback-ed { background: var(--panel); caret-color: transparent; }
.ed-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 4px 8px; border-top: 1px solid var(--rule); background: var(--panel); font-size: 11.5px; color: var(--muted); }
.ed-foot select { height: 24px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); padding: 0 4px; font: 11.5px var(--f-mono); }
.notes-empty { position: absolute; left: 14px; top: 12px; color: var(--faint); font-size: 13px; pointer-events: none; z-index: 2; }
.fallback-ed { width: 100%; height: 100%; border: 0; resize: none; padding: 12px 14px; background: var(--surface); color: var(--ink); font: 13px/1.55 var(--f-mono); outline: none; }
.loading-ed { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font: 12px var(--f-mono); }

.scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, .42); display: grid; place-items: center; z-index: 50; padding: 16px; }
.dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); width: min(460px, 100%); padding: 18px; display: grid; gap: 12px; max-height: calc(100% - 32px); overflow: auto; }
.dialog.wide { width: min(680px, 100%); }
.dialog h3 { margin: 0; font-size: 17px; text-wrap: balance; }
.dialog p { margin: 0; color: var(--muted); }
.dialog .or { font: 600 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-top: 4px; }
.dialog .pick { display: grid; gap: 4px; max-height: 220px; overflow: auto; }
.dialog .foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.dialog .hint { font: 11.5px var(--f-mono); color: var(--faint); }
.probs { display: grid; gap: 4px; max-height: 60vh; overflow: auto; }
.prob { border: 1px solid var(--rule); background: var(--surface); border-radius: 7px; padding: 7px 10px; text-align: left; cursor: pointer; display: grid; gap: 2px; }
.prob:hover { border-color: var(--accent); }
.prob .pp { font: 600 11px var(--f-mono); color: var(--muted); }
.prob .pm { font-size: 13px; }
.prob.error .pp::before { content: '✕ '; color: var(--danger); }
.prob.warning .pp::before { content: '! '; color: var(--warn); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--surface); border-radius: 9px; padding: 9px 12px 9px 14px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); font-size: 13px; max-width: calc(100% - 32px); }
.toast > span { min-width: 0; }
.toast button { flex: none; margin-left: auto; border: 0; background: transparent; color: var(--accent-soft); font-weight: 700; cursor: pointer; padding: 2px 4px; }

.map-switch { flex: none; margin-left: 2px; padding: 6px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-weight: 700; cursor: pointer; }
.map-switch:hover { border-color: var(--accent); color: var(--accent); }
.map-switch[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.body.mode-map { grid-template-columns: minmax(0, 1fr); }
.body.mode-map .rail, .body.mode-map .insp { display: none !important; }
.map-pane { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: var(--canvas); }
.map-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 16px; background: var(--surface); border-bottom: 1px solid var(--rule); color: var(--muted); font: 500 12px var(--f-mono); }
.map-scroll { overflow: hidden; min-height: 0; position: relative; cursor: grab; touch-action: none; background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 18px 18px; }
#mapSvg { display: block; width: 100%; height: 100%; }
.map-scroll.dragging { cursor: grabbing; }
.map-toolbar > div { display: flex; align-items: center; gap: 6px; }
#mapZoomLabel { min-width: 46px; text-align: center; }
.map-node { cursor: pointer; }
.map-node .map-box { fill: var(--surface); stroke: var(--line); stroke-width: 1.4; }
.map-node.doc .map-box { fill: var(--panel); stroke-dasharray: 2 3; }

.map-node .map-sub { fill: var(--faint); font: 500 10.5px var(--f-mono); }
.map-node:hover .map-box { stroke: var(--accent); stroke-width: 2.3; }
.map-node.map-active .map-box { stroke: var(--accent); stroke-width: 2.4; fill: var(--accent-soft); }
.map-node.map-selected .map-box { stroke: var(--accent); stroke-width: 3; fill: var(--accent-soft); }
.map-node.map-selected text { fill: var(--accent); }
.map-node text.map-name { fill: var(--ink); font: 600 13px var(--f-ui); pointer-events: none; }
.map-edge { fill: none; stroke: var(--link); stroke-width: 1.45; opacity: .13; pointer-events: stroke; }
.map-edge:hover { stroke-width: 3; opacity: 1; }
.map-edge.missing { stroke: var(--danger); stroke-dasharray: 6 4; }
.map-edge.md { stroke-dasharray: 2 5; stroke-linecap: round; }
@keyframes mapFlow { to { stroke-dashoffset: -28; } }
#mapSvg .map-edge.map-out, #mapSvg .map-edge.map-in { opacity: 1; stroke-opacity: 1; stroke-width: 2.3; stroke-dasharray: 8 6; animation: mapFlow 1.1s linear infinite; }
#mapSvg .map-edge.md.map-out, #mapSvg .map-edge.md.map-in { stroke-dasharray: 2 5; }
#mapSvg .map-edge.map-out { stroke: var(--accent); }
#mapSvg .map-edge.map-in { stroke: var(--b-teal); }
#mapSvg .map-edge.missing.map-out { stroke: var(--danger); }
@media (prefers-reduced-motion: reduce) { #mapSvg .map-edge.map-out, #mapSvg .map-edge.map-in { animation: none; } }
.map-legend { display: flex; align-items: center; gap: 14px; }
.map-legend i { display: inline-block; width: 22px; height: 0; margin-right: 6px; vertical-align: middle; border-top: 2px dashed; }
.map-legend .out i { border-color: var(--accent); }
.map-legend .in i { border-color: var(--b-teal); }
.map-node, .map-edge { transition: opacity .15s ease; }
#mapSvg.map-animating .map-edge { opacity: .32; }
#mapSvg.map-animating.map-compacting .map-edge:not(.map-hidden) { opacity: .5; }
@media (prefers-reduced-motion: reduce) { .map-node, .map-edge { transition: none; } }
#mapSvg.map-compacting .map-hidden { display: none; }
#mapSvg.map-compacting .map-edge:not(.map-hidden) { opacity: 1; stroke-opacity: 1; }
.map-node.map-dim, .map-edge.map-dim { opacity: .25; }
.map-node.map-related, .map-edge.map-related { opacity: .8; }

.map-edge.map-related { stroke-opacity: 1; opacity: .8; stroke-width: 2.15; }
.map-edge.map-dim { stroke-opacity: 1; opacity: .055; }
.map-group-label { fill: var(--muted); font: 700 12px var(--f-mono); }
.map-file-group { fill: var(--surface); fill-opacity: .12; stroke: var(--line); stroke-opacity: .65; stroke-dasharray: 5 5; }
.map-node.map-active { opacity: 1; }
#mapSvg.map-hovering .map-node.map-active.map-dim { opacity: .25; }
#mapSvg.map-hovering .map-node.map-active.map-related { opacity: .8; }
#mapSvg.map-hovering .map-node.map-active:not(.map-focus):not(.map-selected) .map-box { fill: var(--surface); stroke: var(--line); stroke-width: 1.4; }
#mapSvg .map-node.map-selected .map-box { stroke: var(--accent); stroke-width: 3; fill: var(--accent-soft); }

@media (max-width: 860px) {
  .top { grid-template-columns: auto minmax(0, 1fr) auto auto; row-gap: 8px; padding-block: 8px; }
  .tabs { grid-column: 1 / -1; grid-row: 2; justify-content: stretch; }
  .tab { flex: 1; justify-content: center; }
  .brand .wm { display: none; }
  .body, .body.no-insp { grid-template-columns: minmax(0, 1fr); }
  .rail, .rail-resizer { display: none; }
  .flow-select { display: block; flex: 1 1 160px; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 0 6px; }
  .crumbs { display: none; }
  .hide-narrow { display: none !important; }

  .insp-top { max-height: 34vh; }

}
@media (prefers-reduced-motion: reduce) { #diagram.enter { animation: none; } }
</style>

<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg width="26" height="22" viewBox="0 0 26 22" aria-hidden="true">
        <rect x="1" y="1" width="8" height="5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <rect x="17" y="1" width="8" height="5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M5 7v14M21 7v14" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 2"/>
        <path d="M5 12h14" stroke="var(--accent)" stroke-width="1.6"/>
        <path d="M17 9.5l3.5 2.5-3.5 2.5z" fill="var(--accent)"/>
        <path d="M21 17H8" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="2.5 1.8"/>
        <path d="M10 15l-3 2 3 2" fill="none" stroke="var(--accent)" stroke-width="1.4"/>

      <button class="tab" role="tab" data-tab="preview" id="tab-preview">Preview</button>
    </nav>
    <button class="map-switch" id="btnMap" type="button" aria-pressed="false" title="Map of flows and documents">Map</button>
    <div class="actions">
