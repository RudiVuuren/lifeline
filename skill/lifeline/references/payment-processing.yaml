title: Payment processing details
flows:
  authorisation:
    name: Payment authorisation
    notes: Detailed processing behind the overview's POST /payments request.
    participants:
      - id: api
        name: Payments API
      - id: risk
        name: Risk engine
      - id: vault
        name: Card vault
        type: database
      - id: hsm
        name: HSM
        type: external
      - id: bank
        name: Issuing bank
        type: external
    messages:
      - id: m1
        from: api
        to: risk
        label: Evaluate transaction
        link: risk-assessment
        badges:
          - name: request
            type: yaml
            color: blue
            content: |-
              orderId: ORD-20931
              channel: ecommerce
              amount: 124900
      - id: m2
        from: risk
        to: api
        label: Score accepted
        kind: reply
      - id: m3
        from: api
        to: vault
        label: Resolve token
      - id: m4
        from: vault
        to: api
        label: Return card reference
        kind: reply
      - id: m5
        from: api
        to: hsm
        label: Generate security value
      - id: m6
        from: hsm
        to: api
        label: Security value ready
        kind: reply
      - id: m7
        from: api
        to: bank
        label: Authorise funds
        link: network-approval
      - id: m8
        from: bank
        to: api
        label: Approved
        kind: reply
      - id: m9
        from: api
        to: api
        label: Enforce idempotency
        notes: Self-call example. Duplicate requests reuse the existing payment result.
      - id: m10
        from: api
        to: api
        label: Schedule ledger posting
        link: ledger-updates
  risk-assessment:
    name: Risk assessment
    participants:
      - id: risk
        name: Risk engine
      - id: policy
        name: Rules service
      - id: features
        name: Feature cache
        type: database
    messages:
      - id: m1
        from: risk
        to: features
        label: Fetch signals
      - id: m2
        from: features
        to: risk
        label: Device profile
        kind: reply
      - id: m3
        from: risk
        to: policy
        label: Check rules
      - id: m4
        from: policy
        to: risk
        label: Pass
        kind: reply
        badges:
          - name: "risk: cleared"
            color: green
            content: No elevated-risk rules matched this order.
  network-approval:
    name: Network approval
    participants:
      - id: api
        name: Payments API
      - id: bank
        name: Issuing bank
        type: external
    messages:
      - id: m1
        from: api
        to: bank
        label: Request approval
      - id: m2
        from: bank
        to: api
        label: Approval code
        kind: reply
  ledger-updates:
    name: Ledger updates
    participants:
      - id: api
        name: Payments API
      - id: ledger
        name: Ledger
        type: database
      - id: events
        name: Events queue
        type: queue
    messages:
      - id: m1
        from: api
        to: ledger
        label: Record authorisation
        badges:
          - name: "payment: held"
            color: orange
            content: The ledger records a reservation until capture or cancellation.
      - id: m2
        from: ledger
        to: api
        label: Hold stored
        kind: reply
      - id: m3
        from: api
        to: events
        label: Publish hold event
        kind: async
        link: "payment-operations#notifications"
