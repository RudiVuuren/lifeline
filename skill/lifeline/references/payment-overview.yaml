title: Payment journey
flows:
  checkout:
    name: Checkout and authorisation
    notes: |-
      Entry point for the demonstration workspace.
      The other YAML files must be loaded alongside this one for cross-file drill-down links.
    participants:
      - id: shopper
        name: Shopper
        type: actor
        notes: Initiates the card-not-present purchase.
      - id: web
        name: Checkout UI
      - id: api
        name: Payments API
        link: "payment-processing#authorisation"
        notes: Open its drill-down to inspect payment processing.
      - id: events
        name: Events queue
        type: queue
        link: "payment-operations#notifications"
      - id: bank
        name: Issuing bank
        type: external
    messages:
      - id: m1
        from: shopper
        to: web
        label: Confirm purchase
        notes: The shopper reviewed the basket and shipping address.
      - id: m2
        from: web
        to: api
        label: POST /payments
        link: "payment-processing#authorisation"
        badges:
          - name: request
            type: yaml
            color: blue
            content: |-
              orderId: ORD-20931
              amount: 124900
              currency: ZAR
              paymentToken: tok_sample_27
          - name: "payment: created"
            color: orange
            content: Payment intent recorded; approval has not yet been received.
      - id: m3
        from: api
        to: bank
        label: Request approval
        link: "payment-processing#network-approval"
        notes: The network request is expanded in the linked flow.
      - id: m4
        from: bank
        to: api
        label: Approved
        kind: reply
        badges:
          - name: response
            type: yaml
            color: teal
            content: |-
              approvalCode: '839214'
              decision: approved
          - name: "payment: authorised"
            color: green
            content: Funds reserved by issuer, pending capture.
      - id: m5
        from: api
        to: events
        label: Publish payment event
        kind: async
        link: "payment-operations#notifications"
        badges:
          - name: event
            type: yaml
            color: purple
            content: |-
              eventType: payment.authorised
              paymentId: pay_4827
              occurredAt: '2026-10-13T12:00:00Z'
      - id: m6
        from: api
        to: web
        label: 201 Created
        kind: reply
      - id: m7
        from: web
        to: shopper
        label: Show receipt
        kind: reply
  cancellation:
    name: Payment cancellation
    notes: Shows an additional sibling flow and a red failure status.
    participants:
      - id: shopper
        name: Shopper
        type: actor
      - id: web
        name: Checkout UI
      - id: api
        name: Payments API
      - id: ledger
        name: Ledger
        type: database
        link: "payment-processing#ledger-updates"
    messages:
      - id: m1
        from: shopper
        to: web
        label: Cancel purchase
      - id: m2
        from: web
        to: api
        label: POST /cancel
      - id: m3
        from: api
        to: ledger
        label: Release reserved funds
        link: "payment-processing#ledger-updates"
      - id: m4
        from: ledger
        to: api
        label: Release rejected
        kind: reply
        badges:
          - name: "payment: failed"
            color: red
            content: The ledger rejected this reversal; support investigation is needed.
      - id: m5
        from: api
        to: web
        label: 409 Conflict
        kind: reply
